name: Intern
options:
  bundleIdPrefix: com.devin.typesafe
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Intern:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devin.typesafe.jev-launcher
        INFOPLIST_KEY_CFBundleDisplayName: Intern
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Intern sends Apple Events to System Events and Finder to run system toggles such as Dark Mode, Sleep and Empty Trash.
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
  InternTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Intern
schemes:
  Intern:
    build:
      targets:
        Intern: all
        InternTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - InternTests
