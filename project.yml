name: Intern
options:
  bundleIdPrefix: com.devin.typesafe
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Intern:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources/Intern.icns
    info:
      path: Resources/Info.plist
      properties:
        CFBundleIconFile: Intern
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devin.typesafe.jev-launcher
        MARKETING_VERSION: 0.2.2
        CURRENT_PROJECT_VERSION: 8
        CODE_SIGN_ENTITLEMENTS: Resources/Intern.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Intern
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Intern sends Apple Events to System Events and Finder to run system toggles such as Dark Mode, Sleep and Empty Trash.
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.devin.typesafe.jev-launcher.debug
          INFOPLIST_KEY_CFBundleDisplayName: Intern Dev
  InternTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Intern
schemes:
  Intern:
    build:
      targets:
        Intern: all
        InternTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - InternTests
